<button
  [type]="type"
  class="btn-custom"
  [ngClass]="[appearance, shade, size, width, variant]"
  [class.borderless]="!hasBorder"
  [class.radiusless]="!hasRadius"
  (click)="onClicked()"
  [disabled]="disabled"
  [matTooltip]="tooltip"
>
  @if (icon) {
    <ely-icon [name]="icon" [size]="size" [variant]="variant"></ely-icon>
  }
  <ng-content></ng-content>
</button>
