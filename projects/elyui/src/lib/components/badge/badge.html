<div
  class="badge-container"
  [ngClass]="[size, variant]"
  [class.clickable]="clickable"
  [class.borderless]="!hasBorder"
>
  @if (hasBadgeIcon) {
    <ely-icon name="info" [size]="size"/>
  }
  <ng-content></ng-content>
  @if (hasCloseIcon) {
    <ely-icon name="close" [size]="size" [variant]="variant" (iconclicked)="onClosed()"/>
  }
</div>
